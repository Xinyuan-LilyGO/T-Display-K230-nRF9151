# K230 nRF9151 Serial Modem profile.
#
# Base application:
# /root/espressif/k230/nRF9151/ncs-serial-modem/app/prj.conf

CONFIG_SM_CUSTOMER_VERSION="k230-dual-uart-nmea"

# Keep the AT UART simple for K230. Hardware RTS/CTS and DTR/RI are not routed.
CONFIG_SM_UART_RX_BUF_COUNT=4
CONFIG_SM_UART_RX_BUF_SIZE=2048
CONFIG_SM_UART_TX_BUF_SIZE=2048
CONFIG_SM_URC_BUFFER_SIZE=4096
CONFIG_SM_K230_UART_DIAG=y

# GNSS is part of the official Serial Modem feature set. K230 also enables the
# local NMEA URC extension added by the tracked patch in this directory.
CONFIG_SM_GNSS=y
CONFIG_SM_GNSS_NMEA_URC=y
CONFIG_SM_GNSS_NMEA_URC_DEFAULT=y
CONFIG_SM_GNSS_OUTPUT_NMEA_SATELLITES=y

# Keep the startup modem path close to the official Serial LTE Modem firmware.
# Field tests on 2026-08-07 showed the official firmware can reliably report
# SIM ready, while the manual no-auto-connect K230 build may report
# %XSIM: 0,12 / +CME ERROR: 13 even after a host-side AT+CFUN=1. Let the modem
# app configure system mode and enter CFUN=1 during boot; the K230 app can still
# change CFUN/system mode later for LTE or GNSS-only tests.
CONFIG_SM_AUTO_CONNECT=y
CONFIG_SM_AUTO_CONNECT_SYSTEM_MODE="1,1,1,0"

# Enable the useful official data/control modules. PPP/CMUX remain off by
# default because one un-flow-controlled UART is shared with AT traffic.
CONFIG_SM_SMS=y
CONFIG_SM_MQTTC=y
CONFIG_SM_HTTPC=y
CONFIG_SM_COAPC=y
CONFIG_SM_PPP=n
CONFIG_SM_CMUX=n
CONFIG_SM_XDFU=n

# Keep nRF Cloud assistance compiled in, but GNSS can run without cloud by using
# AT#XGNSS=1,0,... from K230.
CONFIG_SM_NRF_CLOUD=y
CONFIG_NRF_CLOUD_AGNSS=y
CONFIG_NRF_CLOUD_PGPS=n

# UART2 is for logs. Use 115200 to match the K230 board debug requirement.
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_AUTOSTART=y
CONFIG_LOG_DEFAULT_LEVEL=3

# TF-M secure UART logging must not claim UART1.
CONFIG_TFM_LOG_LEVEL_SILENCE=y
# CONFIG_TFM_SECURE_UART is not set

CONFIG_GPIO=y
