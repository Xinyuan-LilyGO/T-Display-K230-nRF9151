#
# K230 nRF9151 AT Client firmware.
#
# This follows Nordic NCS v3.4.0 nrf/samples/cellular/at_client and keeps the
# K230-specific UART/log/heartbeat behavior in this tracked repository.
#

# TF-M config
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# General config
CONFIG_ASSERT=y
CONFIG_GPIO=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=y

# Keep UART1 available to the non-secure application for K230 log output.
CONFIG_TFM_LOG_LEVEL_SILENCE=y
CONFIG_TFM_SECURE_UART=n

# Network
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y

# Modem library
CONFIG_NRF_MODEM_LIB=y

# AT host library
CONFIG_AT_HOST_LIBRARY=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_AT_HOST_LOG_LEVEL_INF=y

# Stacks and heaps
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_AT_MONITOR_HEAP_SIZE=512
